# The merge gate: a pull request into main is tested and, from a claude/* branch, merged by GitHub itself. Cloudflare Pages deploys main on push, so a merge here is the public site claudeslab.com.
#  - `merge-gate tests` runs .github/merge-gate/check.sh on the pull request merged with its base.
#  - `merge-gate label` runs .github/merge-gate/label.sh: the gate's own files (.github/merge-gate/ and this workflow) need "owner-go"; everything else needs "go".
#    "owner-go" counts only when the repo's owner added it by hand on github.com. The gate's files are the lock itself: a
#    change to them changes what merges. Files that steer a Claude session or run by themselves (CLAUDE.md, AGENTS.md,
#    SKILL.md, .claude/, the other workflows, scripts/) need "go", like code. From the morning to the evening of
#    2026-11-20 they needed "owner-go" too; LOCKS below keeps that line in a comment. A new push takes both labels off.
#  - `report` posts one commit status, "merge-gate", on the pull request's head. The rule set on main requires it.
#  - `merge` merges claude/* heads from this repo, exactly the commit that was tested.
# pull_request_target: GitHub runs this file from the default branch, and check.sh and label.sh are taken from the
# default branch too, so a pull request can't edit the gate that judges it. Pull-request code is checked out read-only,
# with no secrets, and only the tests job runs it.
# Disabling or deleting this workflow turns auto-merge off.
name: Merge gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: merge-gate tests
    if: github.event.pull_request.draft == false && github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The gate script, from the default branch
        env:
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          git show "origin/$MAIN:.github/merge-gate/check.sh" > "$RUNNER_TEMP/check.sh" \
            || { echo "::error::origin/$MAIN has no .github/merge-gate/check.sh"; exit 1; }
          echo "gate script: origin/$MAIN @ $(git rev-parse --short "origin/$MAIN")"
      - name: Merge the base in (test what would land)
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git -c user.name=merge-gate -c user.email=merge-gate@invalid merge --no-edit -q "origin/$BASE" \
            || { echo "::error::this pull request conflicts with $BASE: merge $BASE into the branch and push"; exit 1; }
      - name: Checks (.github/merge-gate/check.sh)
        env:
          BASE: ${{ github.base_ref }}
        run: bash "$RUNNER_TEMP/check.sh" "$BASE"

  label:
    name: merge-gate label
    # runs on drafts too: a push while the pull request is a draft takes the labels off as well
    if: github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      ok: ${{ steps.label.outputs.ok }}
      why: ${{ steps.label.outputs.why }}
    steps:
      # the default branch's copy of the gate; no pull-request code is checked out in this job
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/merge-gate
          persist-credentials: false
      - name: Which label this pull request needs (.github/merge-gate/label.sh)
        id: label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
          OWNER: ${{ github.repository_owner }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE: ${{ github.base_ref }}
          # lock files (owner-go): the gate itself, which is its scripts and this workflow.
          # Until the evening of 2026-11-20 this was:
          #   '(^|/)\.[^/]+(/|$)|(^|/)(CLAUDE|AGENTS|GEMINI|SKILL)(\.local)?\.md$|^scripts/'
          LOCKS: '^\.github/merge-gate/|^\.github/workflows/merge-gate\.yml$'
          FREE: ''
          NOT_FREE: ''
          ALL_LOCKS: ''
        run: bash .github/merge-gate/label.sh

  report:
    needs: [tests, label]
    if: ${{ !cancelled() && github.event.pull_request.draft == false && github.base_ref == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      statuses: write
    outputs:
      ok: ${{ steps.post.outputs.ok }}
    steps:
      - name: Post the merge-gate status on the pull request's head
        id: post
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          TESTS: ${{ needs.tests.result }}
          LABEL: ${{ needs.label.result }}
          LABEL_OK: ${{ needs.label.outputs.ok }}
          WHY: ${{ needs.label.outputs.why }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$TESTS" = success ] && [ "$LABEL" = success ] && [ "$LABEL_OK" = true ]; then state=success; d="checks pass, ${WHY:-label on}"
          elif [ "$TESTS" != success ]; then state=failure; d="the checks failed"
          elif [ "$LABEL" != success ]; then state=failure; d="checks pass; the label job itself failed (re-run it)"
          else state=pending; d="checks pass; ${WHY:-waiting for a label}"; fi
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state="$state" -f context=merge-gate -f description="${d:0:138}" -f target_url="$RUN" >/dev/null
          echo "merge-gate: $state ($d)"
          if [ "$state" = success ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          [ "$state" != failure ]

  merge:
    needs: [report]
    # head.repo == this repo: a fork can name its branch claude/anything
    if: needs.report.outputs.ok == 'true' && startsWith(github.head_ref, 'claude/') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the commit that was tested
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" --repo "$REPO" --merge --match-head-commit "$SHA" --delete-branch
